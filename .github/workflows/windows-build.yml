name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate models
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --concurrency=1

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Package Windows installer
        shell: pwsh
        run: |
          $pubspec = Get-Content 'pubspec.yaml' -Raw -Encoding utf8
          $versionMatch = [regex]::Match($pubspec, '(?m)^version:\s*([^+\s]+)')
          if (-not $versionMatch.Success) { throw 'App version is missing from pubspec.yaml.' }
          $env:DEPT_ACCOUNTING_VERSION = $versionMatch.Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc 'installer/dept_accounting.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: build/distribution/*-windows-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
