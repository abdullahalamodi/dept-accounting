name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate models
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --concurrency=1

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: dept-accounting-windows-x64-${{ github.run_number }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
