name: Windows build
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build distributable
        shell: pwsh
        run: ./tool/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: دبت للحسابات-windows-development
          path: build/distribution/*.zip
